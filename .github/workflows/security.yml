name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Literal prefix: as a reusable workflow, github.workflow is the caller's name.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  malware:
    name: Malware / ClamAV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test scanner failure handling
        run: python3 -m unittest discover -s scripts/release -p test_scan_malware.py

      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clamav clamav-freshclam
          # Stop the background updater before taking its database/log lock.
          sudo systemctl stop clamav-freshclam.service
          # clamscan is standalone; no clamd daemon needs update notifications.
          sudo sed -i '/^NotifyClamd /d' /etc/clamav/freshclam.conf
          sudo freshclam
          clamscan --version

      - name: Scan tracked source, fixtures and bundled files
        shell: bash
        run: |
          set -euo pipefail
          scan_root="$(mktemp -d "$RUNNER_TEMP/archguard-source.XXXXXX")"
          # Export the exact revision: no .git objects, local caches or build trees.
          git archive --format=tar HEAD | tar -xf - -C "$scan_root"
          bash scripts/release/scan_malware.sh "$scan_root"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build the default CLI artifact
        run: cargo build -p archguard-cli --release --locked

      - name: Scan the built CLI
        run: bash scripts/release/scan_malware.sh target/release/archguard

  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan all fetched Git history (redacted output)
        run: gitleaks git . --log-opts="--all" --redact=100 --no-banner --exit-code=1
