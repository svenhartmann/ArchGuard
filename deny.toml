# Lizenz-Gate fuer die eigenen Dependencies. Advisories bleiben bei cargo-audit;
# CIfaehrt daher nur `cargo deny check licenses`.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"

# Slint wird unter der Royalty-free-Lizenz genutzt; die Crates deklarieren
# "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0".
[[licenses.clarify]]
name = "i-slint-backend-selector"
version = "1.18.1"
expression = "LicenseRef-Slint-Royalty-free-2.0"
license-files = []
[[licenses.exceptions]]
name = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

