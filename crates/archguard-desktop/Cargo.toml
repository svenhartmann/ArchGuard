[package]
name = "archguard-desktop"
description = "L3: native desktop viewer (Slint prototype) for the module dependency graph."
version.workspace = true
edition.workspace = true
license.workspace = true
# The distributed binary links Slint under the Slint Royalty-free License 2.0,
# which requires the AboutSlint attribution shown in the app's About dialog.

[[bin]]
name = "archguard-desktop"
path = "src/main.rs"

[dependencies]
archguard-engine = { path = "../archguard-engine" }
petgraph = "0.8"
slint = "1.18"
# PNG for image export (`export.rs`) and the off-screen snapshot.
png = "0.18"
serde_json = "1"
# Native folder picker for "Open project"; on Linux via the XDG desktop
# portal only, without GTK.
# Comment-preserving reads and writes of desktop.toml.
toml_edit = "0.25"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Dock icon when run without an app bundle and the app menu's Quit;
# already in the tree via winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData"] }

[dev-dependencies]
# Parses exported SVG in tests.
roxmltree = "0.21.1"

[build-dependencies]
slint-build = "1.18"

[features]
# `ARCHGUARD_DESKTOP_SNAPSHOT=<file.png>` renders the window to a PNG and
# exits; used to check the real UI without screen-recording rights.
snapshot = []
