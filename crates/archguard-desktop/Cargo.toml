[package]
name = "archguard-desktop"
description = "L3: native desktop viewer (Slint prototype) for the module dependency graph."
version.workspace = true
edition.workspace = true
license.workspace = true
# The distributed binary links Slint under the Slint Royalty-free License 2.0,
# which requires the AboutSlint attribution shown in the app's About dialog.

[[bin]]
name = "archguard-desktop"
path = "src/main.rs"

[dependencies]
archguard-engine = { path = "../archguard-engine" }
petgraph = "0.8"
slint = "1.18"
png = { version = "0.18", optional = true }

# Dock icon when run without an app bundle; already in the tree via winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
slint-build = "1.18"

[features]
# `ARCHGUARD_DESKTOP_SNAPSHOT=<file.png>` renders the window to a PNG and
# exits; used to check the real UI without screen-recording rights.
snapshot = ["dep:png"]
