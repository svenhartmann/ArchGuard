[package]
name = "archguard-update"
description = "Self-update from published GitHub releases, shared by the CLI and the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
self-replace = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
