[package]
name = "archguard-report"
description = "L1: formatters for the report types (json, text, mermaid, dot, graphml, sarif)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
archguard-core = { path = "../archguard-core" }
# The report formats are serialization; serde_json is the canonical writer.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Spans for ArchGuard's self-instrumentation (ADR 0004); inert without a subscriber.
tracing = "0.1.44"
# Markdown parsing for the AsciiDoc and Word exports (ADR 0013); already in the lock via Slint.
pulldown-cmark = { version = "0.13", default-features = false }
# The .docx package is a zip archive (ADR 0013); the same crate archguard-update reads releases with.
zip = { version = "9", default-features = false, features = ["deflate"] }
