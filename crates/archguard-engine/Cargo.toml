[package]
name = "archguard-engine"
description = "L2: config loading, pipeline orchestration, graph cache."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quote = "1"
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
globset = "0.4"
ignore = "0.4.33"
roxmltree = "0.21.1"
# T41 snapshot files are serde documents, like the core types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
toml = "1.1.8"
tempfile = "3.27.0"
archguard-analysis = { path = "../archguard-analysis" }
archguard-core = { path = "../archguard-core" }
archguard-extract = { path = "../archguard-extract" }
archguard-report = { path = "../archguard-report" }
archguard-store = { path = "../archguard-store" }

[target.'cfg(unix)'.dependencies]
# F03: descriptor-relative, no-follow cache writes (mkdirat/openat/
# renameat with O_NOFOLLOW). Already vendored via tempfile, no new
# transitive closure.
rustix = { version = "1.1.5", features = ["fs"] }

[features]
db = ["archguard-store/db"]

[dev-dependencies]
tempfile = "3.27.0"
