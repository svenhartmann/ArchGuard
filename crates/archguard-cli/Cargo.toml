[package]
name = "archguard-cli"
description = "L3: the `archguard` command-line interface."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "archguard"
path = "src/main.rs"

[dependencies]
archguard-engine = { path = "../archguard-engine" }
archguard-mcp = { path = "../archguard-mcp" }
archguard-update = { path = "../archguard-update" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
# The update tests build release archives and checksums like the release scripts.
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[features]
db = ["archguard-engine/db", "archguard-mcp/db"]
