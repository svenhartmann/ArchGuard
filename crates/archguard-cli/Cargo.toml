[package]
name = "archguard-cli"
description = "L3: the `archguard` command-line interface."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "archguard"
path = "src/main.rs"

[dependencies]
archguard-engine = { path = "../archguard-engine" }
archguard-mcp = { path = "../archguard-mcp" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
self-replace = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[features]
db = ["archguard-engine/db", "archguard-mcp/db"]
