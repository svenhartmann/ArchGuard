[package]
name = "archguard-store"
description = "L1: GraphStore trait, graph-DB mirror (openCypher), query guard."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
archguard-core = { path = "../archguard-core" }
serde_json = "1"
# Pinned LadybugDB backend (ARCHITECTURE.md Kap. 8.1): `lbug` is the official
# Rust crate of LadybugDB, the maintained successor of the archived Kuzu.
# Optional: enabled only via the `db` feature. lbug requests `cxx` and
# `cxx-build` as caret ranges, so Cargo.lock moves both bridge halves together
# and no resolver pin is needed any more.
# lbug's build script downloads the newest prebuilt liblbug release (no
# checksum, independent of this pin) unless LBUG_BUILD_FROM_SOURCE is set;
# /.cargo/config.toml sets it, so the native library is built from the C++
# sources inside this pinned crate.
lbug = { version = "=0.22.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Enables the graph-database backend (LadybugStore on top of lbug).
db = ["dep:lbug"]
