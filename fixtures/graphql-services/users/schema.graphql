"""Users subgraph."""
extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Query {
  user(id: ID!): User
  users(first: Int = 10): [User!]!
  node(id: ID!): Node
}

type Mutation {
  createUser(name: String!, email: String): User!
}

interface Node {
  id: ID!
}

type User implements Node @key(fields: "id") {
  id: ID!
  name: String!
  email: String
}
