# ArchGuard — CLI + MCP tool for software architecture analysis.
[workspace]
resolver = "3"
members = [
    "crates/archguard-analysis",
    "crates/archguard-cli",
    "crates/archguard-core",
    "crates/archguard-desktop",
    "crates/archguard-desktop-ui",
    "crates/archguard-engine",
    "crates/archguard-extract",
    "crates/archguard-mcp",
    "crates/archguard-report",
    "crates/archguard-store",
    "crates/archguard-update",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"

# Keep target/debug small: line tables are enough for backtraces with file:line,
# dependencies carry no debug info at all. Dependencies are optimized, so the
# desktop app's renderer (Slint) runs smoothly with a plain `cargo run`; the
# workspace's own crates stay unoptimized for fast rebuilds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
